[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-observation-service"
version = "1.0.0"
description = "Astronomical Observations and Journal Microservice for Polaris"
authors = [{ name = "Polaris Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "PyJWT>=2.8.0",
    "httpx>=0.27.0",
    "pika>=1.3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
