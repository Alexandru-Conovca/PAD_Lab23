apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: polaris
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: traefik:v3.0
          imagePullPolicy: IfNotPresent
          args:
            - "--configFile=/etc/traefik/traefik.yml"
          ports:
            - containerPort: 80
              name: web
            - containerPort: 8080
              name: dashboard
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/traefik
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /ping
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: gateway-config
          configMap:
            name: gateway-config
