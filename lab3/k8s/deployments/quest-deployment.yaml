apiVersion: apps/v1
kind: Deployment
metadata:
  name: quest-service
  namespace: polaris
  labels:
    app: quest-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quest-service
  template:
    metadata:
      labels:
        app: quest-service
    spec:
      containers:
        - name: quest-service
          image: polaris/quest-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
              name: http
          env:
            - name: SERVICE_NAME
              value: "quest-service"
            - name: PORT
              value: "8005"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: polaris-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polaris-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: polaris-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: polaris-config
                  key: POSTGRES_PORT
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/quest_db"
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: polaris-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: polaris-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: polaris-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polaris-secrets
                  key: RABBITMQ_PASSWORD
            - name: CATALOG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: polaris-config
                  key: CATALOG_SERVICE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-secrets
                  key: JWT_SECRET
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: polaris-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
