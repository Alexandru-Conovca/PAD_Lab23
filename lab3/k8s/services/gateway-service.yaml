apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: polaris
  labels:
    app: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: web
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: dashboard
      port: 8080
      targetPort: 8080
      nodePort: 30088
